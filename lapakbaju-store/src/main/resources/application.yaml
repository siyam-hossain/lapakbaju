spring:
  application:
    name: lapakbaju-store

  datasource:
    url: jdbc:mysql://localhost:3306/lapakbaju?createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Custom file storage properties
file:
  upload:
    # Uses system environment variable UPLOAD_PROFILE_DIR if present, else defaults to local path
    user-profile: ${UPLOAD_PROFILE_DIR:D:/xampp/htdocs/lapakbaju/images/profiles/}
    product: ${UPLOAD_PRODUCT_DIR:D:/xampp/htdocs/lapakbaju/images/products/}