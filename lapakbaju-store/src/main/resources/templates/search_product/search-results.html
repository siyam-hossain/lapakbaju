<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - LapakBaju</title>
    <th:block th:replace="~{client_fragments/navbar.html :: client-navbar}"></th:block>
    <th:block th:replace="~{product_fragments/product-card.html :: product-card-css}"></th:block>
    <th:block th:replace="~{footer_fragments/footer.html :: footer-css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/search_product/search-results.css}">
</head>
<body>

<header>
    <th:block th:replace="~{client_fragments/navbar.html :: navbar-fragment}"></th:block>
</header>

<main class="container search-page-container">
    <div class="search-header">
        <h1 class="search-title">
            Search Results for: <span class="search-keyword" th:text="${'&#34;' + keyword + '&#34;'}">"Keyword"</span>
        </h1>
        <p class="search-count" aria-live="polite"
           th:text="${totalResults + (totalResults == 1 ? ' product found' : ' products found')}">0 products found</p>
    </div>

    <!-- Results Grid -->
    <div class="product-grid" th:if="${products != null and !products.isEmpty()}">
        <th:block th:each="product : ${products}">
            <th:block th:replace="~{product_fragments/product-card.html :: product-card(product=${product})}"></th:block>
        </th:block>
    </div>

    <!-- Empty State -->
    <div class="search-empty-state" role="status" th:if="${products == null or products.isEmpty()}">
        <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" height="64px" viewBox="0 -960 960 960" width="64px" fill="#9e968c">
                <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-260q133 0 226.5-93.5T700-580q0-133-93.5-226.5T380-900q-133 0-226.5 93.5T60-580q0 133 93.5 226.5T380-260Z"/>
            </svg>
        </div>
        <h2>No products found</h2>
        <p>We couldn't find any items matching your search term. Try checking for typos or searching for a different keyword.</p>
        <a th:href="@{/}" class="btn-back-home">Back to Shop</a>
    </div>
</main>

<th:block th:replace="~{footer_fragments/footer.html :: footer}"></th:block>
<th:block th:replace="~{client_fragments/navbar.html :: client-navbar-js}"></th:block>

</body>
</html>
