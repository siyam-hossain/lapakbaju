<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Lapakbaju</title>
    <link rel="stylesheet" th:href="@{/css/login/forget-password.css}" href="login.css">
</head>
<body>
    <div class="login-reg">
        <!-- Brand Logo -->
        <a th:href="@{/}" class="brand-logo">
            <div class="brand-icon"></div>
            <span>lapakbaju</span>
        </a>

        <!-- Main Auth Container -->
        <div class="auth-container">
            <form class="auth-form" id="forgotPasswordForm" th:action="@{/reset-password}" method="post">

                <div class="form-header">
                    <h2 class="form-title">Reset Password 🔒</h2>
                    <p class="form-subtitle">Enter your registered email and choose a new password.</p>
                </div>

                <!-- Global Alert Notifications -->
                <div th:if="${param.error}" class="alert alert-error" style="color: #ef4444; font-size: 13px;">
                    Password reset failed. Please check your details and try again.
                </div>
                <div th:if="${param.success}" class="alert alert-success" style="color: #10b981; font-size: 13px;">
                    Password updated successfully! You can now log in.
                </div>

                <!-- Email Address Field -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-field">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required />
                    </div>
                </div>

                <!-- New Password Field -->
                <div class="input-group">
                    <label for="password">New Password</label>
                    <div class="input-field">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" placeholder="Enter new password" required />
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-field">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required />
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Save Changes</button>

                <!-- Back to Login Link -->
                <div style="text-align: center; margin-top: 8px;">
                    <a th:href="@{/login}" class="forgot-link" style="font-size: 13px;">Back to Sign In</a>
                </div>

            </form>
        </div>
    </div>
</body>
</html>
