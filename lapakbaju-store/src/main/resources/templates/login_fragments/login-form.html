<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lapakbaju</title>
    <link rel="stylesheet" th:href="@{/css/login/login.css}" href="login.css">
</head>
<body>

<div class="login-reg">
    <!-- Embedded Brand Logo Fragment -->
    <a th:href="@{/}" class="brand-logo">
        <div class="brand-icon"></div>
        <span>lapakbaju</span>
    </a>

    <!-- Main Auth Container -->
    <div class="auth-container">
        <form class="auth-form" id="loginForm" th:action="@{/login}" method="post">

            <div class="form-header">
                <h2 class="form-title">Welcome Back! 👋</h2>
                <p class="form-subtitle">Enter your credentials to access your account.</p>
            </div>

            <!-- Global Alert Notifications -->
            <div th:if="${param.error}" class="alert alert-error" style="color: #ef4444; font-size: 13px;">
                Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info" style="color: #10b981; font-size: 13px;">
                You have been logged out.
            </div>

            <!-- Email Field -->
            <div class="input-group">
                <label for="username">Email Address</label>
                <div class="input-field">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" id="username" name="email" placeholder="name@example.com" required />
                </div>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-helpers">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember-me" /> Remember me
                </label>
                <a th:href="@{/forget-password}" class="forgot-link">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Sign In</button>

            <!-- Sign Up Option -->
            <div class="auth-footer">
                <span>Don't have an account?</span>
                <a th:href="@{/register}" class="auth-link">Sign up</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
