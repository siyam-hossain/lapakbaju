<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>

    <th:block th:fragment="product-card-css">
        <link rel="stylesheet" th:href="@{/css/product/product-card.css}">
    </th:block>
</head>
<body>

<!-- Accepts 'product' parameter directly from the call -->
<th:block th:fragment="product-card(product)">
    <div class="product-card" th:if="${product != null}">
        <a th:href="@{/products/{id}(id=${product.id})}" class="card-image-link">
            <div class="card-image-wrapper">
                <!-- Check booleans safely -->
                <span class="badge badge-hot" th:if="${product.isHot == true}">HOT</span>
                <span class="badge badge-new" th:if="${product.isNew == true and product.isHot != true}">NEW</span>

                <!-- Image rendering -->
                <img th:if="${product.image != null and product.image.imageUrl != null}"
                     th:src="@{'/images/products/' + ${product.image.imageUrl}}"
                     alt="Product Image" />

                <!-- Fallback image -->
                <img th:if="${product.image == null or product.image.imageUrl == null}"
                     th:src="@{/images/default-placeholder.png}"
                     alt="Default Image" />
            </div>
        </a>

        <div class="product-category" th:text="${product.category != null ? product.category.name : 'Uncategorized'}">Category</div>
        <h3 class="product-name" th:text="${product.name}">Product Name</h3>

        <div class="card-footer">
            <span class="product-price" th:text="${'$' + #numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">$0.00</span>

            <button class="cart-btn" aria-label="Add to Cart">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </button>

        </div>
    </div>
</th:block>

</body>
</html>
