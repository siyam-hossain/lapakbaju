<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Product</title>

    <!-- Global & Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <th:block th:replace="~{client_fragments/navbar.html :: client-navbar}"></th:block>
    <th:block th:replace="~{footer_fragments/footer :: footer-css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-form.css}">

    <style>
        /* Image Upload Box Placeholder Styles */
        .image-upload-wrapper {
            margin-top: 0.5rem;
        }

        .image-upload-box {
            position: relative;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-upload-box:hover, .image-upload-box.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        .image-upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .upload-placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
        }

        .upload-placeholder-content svg {
            color: #94a3b8;
            transition: color 0.2s ease;
        }

        .image-upload-box:hover .upload-placeholder-content svg {
            color: #3b82f6;
        }

        .upload-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
        }

        .upload-subtitle {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .image-preview {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 6px;
        }

        .image-upload-box.has-image .upload-placeholder-content {
            display: none;
        }

        .image-upload-box.has-image .image-preview {
            display: block;
        }
    </style>
</head>
<body>

<header>
    <th:block th:replace="~{client_fragments/navbar.html :: navbar-fragment}"></th:block>
</header>

<div class="admin-wrapper">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
        <div class="sidebar-head">
            <span class="sidebar-title">Admin panel</span>
            <button class="sidebar-toggle-btn" id="sidebarToggle" type="button"
                    title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="11 17 6 12 11 7"/>
                    <polyline points="18 17 13 12 18 7"/>
                </svg>
            </button>
        </div>

        <div class="sidebar-group">
            <span class="sidebar-group-label">Overview</span>
            <ul class="sidebar-menu">
                <li>
                    <a th:href="@{/admin/analytics}" class="sidebar-link" aria-current="page">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                        <span class="sidebar-text">Analytics</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-group">
            <span class="sidebar-group-label">Products</span>
            <ul class="sidebar-menu">
                <li>
                    <a th:href="@{/admin/products}" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"/>
                            <line x1="8" y1="12" x2="21" y2="12"/>
                            <line x1="8" y1="18" x2="21" y2="18"/>
                            <line x1="3" y1="6" x2="3.01" y2="6"/>
                            <line x1="3" y1="12" x2="3.01" y2="12"/>
                            <line x1="3" y1="18" x2="3.01" y2="18"/>
                        </svg>
                        <span class="sidebar-text">All products</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/products/add}" class="sidebar-link active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                        <span class="sidebar-text">Add product</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/products/update}" class="sidebar-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                        </svg>
                        <span class="sidebar-text">Update product</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/products/delete}" class="sidebar-link danger">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6"/>
                            <path d="M14 11v6"/>
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                        </svg>
                        <span class="sidebar-text">Delete product</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-foot">
            <a th:href="@{/}" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                <span class="sidebar-text">Back to store</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="page-header">
            <h2>Add New Product</h2>
            <a th:href="@{/admin/products}" class="btn-secondary-action">Back to List</a>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/products/add}" th:object="${product}" method="post" enctype="multipart/form-data" class="form-container">
            <div class="form-grid">

                <!-- Left Column: Product Information -->
                <div class="form-card">
                    <h3 class="form-section-title">General Details</h3>

                    <div class="form-group">
                        <label for="name">Product Name *</label>
                        <input type="text" id="name" th:field="*{name}" class="form-input" required placeholder="e.g. Classic Denim Jacket">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="sku">SKU *</label>
                            <input type="text" id="sku" th:field="*{sku}" class="form-input" required placeholder="e.g. SKU-1002">
                        </div>

                        <div class="form-group">
                            <label for="price">Price ($) *</label>
                            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-input" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="shortDescription">Short Description</label>
                        <textarea id="shortDescription" th:field="*{shortDescription}" class="form-input" rows="2" placeholder="Brief overview..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="fullDescription">Full Description</label>
                        <textarea id="fullDescription" th:field="*{fullDescription}" class="form-input" rows="5" placeholder="Detailed product specifications..."></textarea>
                    </div>
                </div>

                <!-- Right Column: Category, Inventory, Flags & Media -->
                <div class="form-card">
                    <h3 class="form-section-title">Category Details</h3>

                    <div class="form-group">
                        <label for="categoryName">Category Name</label>
                        <input type="text" id="categoryName" name="categoryName" class="form-input" placeholder="e.g. Mens Wear">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoryIcon">Icon Code</label>
                            <input type="text" id="categoryIcon" name="categoryIcon" class="form-input" value="shirt" placeholder="e.g. shirt">
                        </div>

                        <div class="form-group">
                            <label for="categoryBg">Background Color</label>
                            <input type="text" id="categoryBg" name="categoryBg" class="form-input" value="#f3f4f6" placeholder="e.g. #f3f4f6">
                        </div>

                        <div class="form-group">
                            <label for="categoryColor">Text Color</label>
                            <input type="text" id="categoryColor" name="categoryColor" class="form-input" value="#1f2937" placeholder="e.g. #1f2937">
                        </div>
                    </div>

                    <h3 class="form-section-title" style="margin-top: 1rem;">Inventory & Media</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="stockQuantity">Stock Quantity *</label>
                            <input type="number" id="stockQuantity" name="stockQuantity" value="0" class="form-input" required min="0">
                        </div>

                        <div class="form-group">
                            <label for="recorderThreshold">Reorder Threshold</label>
                            <input type="number" id="recorderThreshold" name="recorderThreshold" value="10" class="form-input" min="0">
                        </div>
                    </div>

                    <!-- Interactive Image Box Placeholder -->
                    <div class="form-group">
                        <label>Product Main Image</label>
                        <div class="image-upload-wrapper">
                            <div class="image-upload-box" id="uploadBox">
                                <input type="file" id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(event)">

                                <div class="upload-placeholder-content">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                    <span class="upload-title">Click to upload or drag image here</span>
                                    <span class="upload-subtitle">PNG, JPG, WEBP or GIF (Max 5MB)</span>
                                </div>

                                <img id="imagePreview" class="image-preview" alt="Image preview">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Flags & Visibility</label>
                        <div class="flags-grid">
                            <label class="checkbox-label">
                                <input type="checkbox" th:field="*{isActive}"> Active
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" th:field="*{isHot}"> Hot
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" th:field="*{isNew}"> New
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" th:field="*{isFeatured}"> Featured
                            </label>
                        </div>
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary-action">Save Product</button>
            </div>
        </form>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer_fragments/footer :: footer}"></div>

<script>
    // Sidebar toggle
    document.getElementById('sidebarToggle')?.addEventListener('click', function () {
        document.getElementById('adminSidebar').classList.toggle('collapsed');
    });

    // Image Upload Preview Function
    function previewImage(event) {
        const input = event.target;
        const uploadBox = document.getElementById('uploadBox');
        const preview = document.getElementById('imagePreview');

        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function(e) {
                preview.src = e.target.result;
                uploadBox.classList.add('has-image');
            };

            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = '';
            uploadBox.classList.remove('has-image');
        }
    }

    // Drag and Drop styling
    const uploadBox = document.getElementById('uploadBox');
    ['dragenter', 'dragover'].forEach(eventName => {
        uploadBox.addEventListener(eventName, () => uploadBox.classList.add('dragover'), false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('dragover'), false);
    });
</script>
</body>
</html>
