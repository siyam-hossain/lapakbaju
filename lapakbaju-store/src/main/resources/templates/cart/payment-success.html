<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - LapakBaju</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <th:block th:replace="~{client_fragments/navbar :: client-navbar}"></th:block>
</head>
<body class="bg-light">

<div th:replace="~{client_fragments/navbar :: navbar-fragment}"></div>

<main class="container my-5 text-center">
  <div class="bg-white p-5 rounded shadow-sm mx-auto" style="max-width: 600px;">
    <div class="text-success mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l4.992-6a.75.75 0 0 0-.01-1.05z"/>
      </svg>
    </div>
    <h2 class="fw-bold">Payment Successful!</h2>
    <p class="text-muted">Thank you for your purchase. Your order has been placed successfully.</p>

    <div th:if="${order != null}" class="bg-light p-3 rounded text-start my-4">
      <p class="mb-1"><strong>Order Number:</strong> <span th:text="${order.orderNumber}">ORD-XXXX</span></p>
      <p class="mb-1"><strong>Total Paid:</strong> <span th:text="'$' + ${#numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</span></p>
      <p class="mb-0"><strong>Status:</strong> <span class="badge bg-success" th:text="${order.status}">PAID</span></p>
    </div>

    <a th:href="@{/products}" class="btn btn-primary btn-lg px-4">Continue Shopping</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{client_fragments/navbar :: client-navbar-js}"></th:block>

</body>
</html>
