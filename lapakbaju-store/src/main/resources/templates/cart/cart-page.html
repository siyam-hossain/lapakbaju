<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - LapakBaju</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:replace="~{client_fragments/navbar :: client-navbar}"></th:block>
</head>
<body class="bg-light">

<div th:replace="~{client_fragments/navbar :: navbar-fragment}"></div>

<main class="container my-5 bg-white p-4 rounded shadow-sm">
    <h2 class="mb-4 fw-bold">Shopping Cart</h2>

    <div th:if="${cartItems != null and !#lists.isEmpty(cartItems)}">
        <div class="row fw-bold border-bottom pb-2 mb-3 d-none d-md-flex text-secondary">
            <div class="col-md-2">Product</div>
            <div class="col-md-4">Name</div>
            <div class="col-md-3">Quantity</div>
            <div class="col-md-3 text-end">Price</div>
        </div>

        <div th:each="item : ${cartItems}" class="row align-items-center border-bottom py-3">
            <div class="col-md-2 col-4 mb-2 mb-md-0">
                <img th:src="${item.product.image != null and item.product.image.imageUrl != null ? '/images/products/' + item.product.image.imageUrl : '/images/default-placeholder.png'}"
                     class="img-fluid rounded border"
                     style="max-height: 80px; object-fit: cover;"
                     alt="Product Image"/>
            </div>

            <div class="col-md-4 col-8 mb-2 mb-md-0">
                <h5 class="mb-1" th:text="${item.product.name}">Product Name</h5>
                <small class="text-muted d-block"
                       th:if="${item.product.inventory != null}"
                       th:text="'Stock available: ' + ${item.product.inventory.stockQuantity}">In Stock: 10</small>
            </div>

            <div class="col-md-3 col-6">
                <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center">
                    <input type="hidden" name="cartItemId" th:value="${item.id}" />
                    <input type="number"
                           name="quantity"
                           th:value="${item.quantity}"
                           min="0"
                           th:max="${item.product.inventory != null ? item.product.inventory.stockQuantity : 1}"
                           class="form-control me-2 text-center"
                           style="width: 80px;" />
                    <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                </form>
            </div>

            <div class="col-md-3 col-6 text-end fs-5 fw-semibold text-primary">
                <span th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
            <a th:href="@{/products}" class="btn btn-outline-secondary">&larr; Continue Shopping</a>
            <a th:href="@{/cart/checkout}" class="btn btn-success btn-lg px-4">Proceed to Checkout</a>
        </div>
    </div>

    <div th:unless="${cartItems != null and !#lists.isEmpty(cartItems)}" class="text-center py-5">
        <p class="text-muted fs-4">Your cart is currently empty.</p>
        <a th:href="@{/products}" class="btn btn-primary btn-lg mt-3">Start Shopping</a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{client_fragments/navbar :: client-navbar-js}"></th:block>

</body>
</html>
