<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - LapakBaju</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <th:block th:replace="~{client_fragments/navbar :: client-navbar}"></th:block>
</head>
<body class="bg-light">

<div th:replace="~{client_fragments/navbar :: navbar-fragment}"></div>

<main class="container my-5">
  <h2 class="mb-4 fw-bold">Checkout</h2>

  <form th:action="@{/cart/checkout/pay}" method="post">
    <div class="row">
      <!-- Delivery Details & Payment Selection -->
      <div class="col-md-7">
        <div class="bg-white p-4 rounded shadow-sm mb-4">
          <h4 class="mb-3">1. Shipping Address</h4>
          <div class="mb-3">
            <label class="form-label">Address Line</label>
            <input type="text"
                   name="shippingAddress"
                   class="form-control"
                   required
                   placeholder="123 Main Street"
                   th:value="${user?.address?.addressLine}">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">City</label>
              <input type="text"
                     name="city"
                     class="form-control"
                     required
                     placeholder="Jakarta"
                     th:value="${user?.address?.city}">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Postal Code</label>
              <input type="text"
                     name="postalCode"
                     class="form-control"
                     required
                     placeholder="12345"
                     th:value="${user?.address?.postalCode}">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Country</label>
              <input type="text"
                     name="country"
                     class="form-control"
                     required
                     placeholder="Indonesia"
                     th:value="${user?.address?.country}">
            </div>
          </div>
        </div>

        <div class="bg-white p-4 rounded shadow-sm">
          <h4 class="mb-3">2. Payment Method</h4>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="paymentMethod" id="creditCard" value="CREDIT_CARD" checked>
            <label class="form-check-label" for="creditCard">Credit / Debit Card</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="paymentMethod" id="bankTransfer" value="BANK_TRANSFER">
            <label class="form-check-label" for="bankTransfer">Bank Transfer (VA)</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="paymentMethod" id="eWallet" value="E_WALLET">
            <label class="form-check-label" for="eWallet">E-Wallet (GoPay, OVO, QRIS)</label>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="col-md-5 mt-4 mt-md-0">
        <div class="bg-white p-4 rounded shadow-sm">
          <h4 class="mb-3">Order Summary</h4>

          <div th:each="item : ${cartItems}" class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
            <div class="d-flex align-items-center">
              <img th:src="${item.product.image != null and item.product.image.imageUrl != null ? '/images/products/' + item.product.image.imageUrl : '/images/default-placeholder.png'}"
                   class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;" alt="Product">
              <div>
                <h6 class="mb-0" th:text="${item.product.name}">Product Name</h6>
                <small class="text-muted" th:text="'Qty: ' + ${item.quantity}">Qty: 1</small>
              </div>
            </div>
            <span class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
          </div>

          <div class="d-flex justify-content-between fs-5 fw-bold mt-3 border-top pt-3">
            <span>Total Amount:</span>
            <span class="text-primary" th:text="'$' + ${#numbers.formatDecimal(totalPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
          </div>

          <button type="submit" class="btn btn-success w-100 btn-lg mt-4">Pay & Complete Order</button>
          <a th:href="@{/cart}" class="btn btn-link text-decoration-none w-100 text-center mt-2">&larr; Back to Cart</a>
        </div>
      </div>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{client_fragments/navbar :: client-navbar-js}"></th:block>

</body>
</html>
